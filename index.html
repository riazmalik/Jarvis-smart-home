<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاروس - سمارٹ ہوم</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">🔌 جاروس سمارٹ ہوم</div>
        <div class="subtitle">🎤 آواز · 🖐️ اشارہ · 🌐 ویب کنٹرول</div>
        
        <div class="status-bar">
            <div>💡 روشنی: <span id="bulbCount">0/4</span> آن</div>
            <div>🖐️ اشارہ: <span id="gestureStatus">کوئی نہیں</span></div>
        </div>
        
        <div class="btn-grid" id="bulbs">
            <div class="btn off" id="btn-living" onclick="toggleBulb(0)">
                <span class="icon">🛋️</span>
                <span>لونگ روم</span>
                <span id="status-living">بند</span>
            </div>
            <div class="btn off" id="btn-bedroom" onclick="toggleBulb(1)">
                <span class="icon">🛏️</span>
                <span>بیڈ روم</span>
                <span id="status-bedroom">بند</span>
            </div>
            <div class="btn off" id="btn-kitchen" onclick="toggleBulb(2)">
                <span class="icon">🍳</span>
                <span>کچن</span>
                <span id="status-kitchen">بند</span>
            </div>
            <div class="btn off" id="btn-study" onclick="toggleBulb(3)">
                <span class="icon">📚</span>
                <span>سٹڈی</span>
                <span id="status-study">بند</span>
            </div>
        </div>
        
        <div class="master">
            <button class="master-btn all-on" onclick="allOn()">💡 سب آن</button>
            <button class="master-btn all-off" onclick="allOff()">💡 سب بند</button>
        </div>
        
        <div class="voice-cmd">
            <button class="voice-btn" onclick="sendVoice('سب لائٹ آن کرو')">سب آن</button>
            <button class="voice-btn" onclick="sendVoice('سب لائٹ بند کرو')">سب بند</button>
            <button class="voice-btn" onclick="sendVoice('لونگ روم لائٹ آن کرو')">لونگ روم آن</button>
            <button class="voice-btn" onclick="sendVoice('بیڈ روم لائٹ بند کرو')">بیڈ روم بند</button>
        </div>
        
        <div class="log" id="logContainer">
            <div class="log-entry"><span class="time">[سیسٹم]</span> <span class="urdu">جاروس تیار ہے</span></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
